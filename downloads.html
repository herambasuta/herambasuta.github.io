<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Downloads — Herambasuta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="site-header"></div>


<main>

    <section class="intro">

        <h2>Downloads</h2>

        <p>
            Books, texts, notes and other materials available for download.
        </p>

    </section>


    <section class="downloads-section">

        <div class="download-item">

            <h3>Example Document</h3>

            <p>PDF document</p>

            <a href="downloads/example.pdf" download class="download-button">
                Download PDF
            </a>

        </div>

    </section>

</main>


<footer>
    © 2026 Herambasuta
</footer>
<script>
fetch("header.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("site-header").innerHTML = data;
    });
</script>
</body>
</html>
